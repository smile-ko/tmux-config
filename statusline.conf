# vim: ft=tmux
# Lualine normal (lua/lualine/themes/_tokyonight.lua): a=blue+black, b=fg_gutter+blue, c=bg_statusline+fg_sidebar
# Night palette (lua/tokyonight/colors/night.lua + storm): bg #1a1b26, bg_dark #16161e, fg_gutter #3b4261, blue #7aa2f7, fg_dark #a9b1d6
# Nền status dùng bg (#1a1b26) thay vì bg_dark — mềm hơn extras/tmux (bg_statusline = bg_dark)

set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261,bg=default"
set -g pane-active-border-style "fg=#7aa2f7,bg=default"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#a9b1d6,bg=#1a1b26"

set -g status-bg "#1a1b26"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#a9b1d6,bg=#3b4261,bold] #(whoami) #[fg=#3b4261,bg=#1a1b26]"

set -g status-right "#[fg=#3b4261,bg=#1a1b26,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261]#[fg=#15161e,bg=#7aa2f7,bold] #h "

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#1a1b26"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#1a1b26"
setw -g window-status-format '#[fg=#1a1b26,bg=#1a1b26]#[default] #I  #{b:pane_current_path} #[fg=#1a1b26,bg=#1a1b26,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#1a1b26,bg=#3b4261]#[fg=#7aa2f7,bg=#3b4261] #I #[fg=#3b4261,bg=#7aa2f7] #{b:pane_current_path} #[fg=#7aa2f7,bg=#1a1b26,nobold]'
