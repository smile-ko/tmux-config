#### COLOUR — Tokyo Night night (folke/tokyonight.nvim), transparent terminal bg

set -g popup-border-style 'fg=#3b4261'
set -g popup-border-lines heavy

set-option -g status-fg "#a9b1d6"
set-option -g status-bg default
set -g pane-active-border-style fg=#7aa2f7,bg=default
set -g window-style fg=#565f89,bg=default
set -g window-active-style fg=#c0caf5,bg=default

# default statusbar (statusline.conf overrides when sourced after)
set-option -g status-style bg=default,fg=#a9b1d6,default

set-window-option -g window-status-style fg=#565f89,bg=default,dim

set-window-option -g window-status-current-style fg=#7aa2f7,bg=default,bright

set-option -g pane-border-style fg=#3b4261,bg=default

set-option -g message-style bg=default,fg=#7aa2f7

set-option -g display-panes-active-colour colour75
set-option -g display-panes-colour colour203

# clock — Tokyo Night yellow #e0af68 (colour214)
set-window-option -g clock-mode-colour colour214
